<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — WebStudio</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="admin-container">
        <!-- Giriş Formu (Giriş edilməyibsə görünür) -->
        <div id="loginSection" class="login-card">
            <h2><i class="fa-solid fa-user-shield"></i> Admin Girişi</h2>
            <form onsubmit="handleLogin(event)">
                <input type="email" id="adminEmail" class="input-dark" placeholder="Email" required>
                <input type="password" id="adminPassword" class="input-dark" placeholder="Şifrə" required>
                <button type="submit" class="btn-admin">Daxil Ol</button>
            </form>
        </div>

        <!-- Dashboard (Giriş edildikdən sonra görünür) -->
        <div id="dashboardSection" class="hidden">
            <div class="dashboard-header">
                <h2><i class="fa-solid fa-list-check"></i> Müraciətlər Siyahısı</h2>
                <button onclick="handleLogout()" class="btn-delete" style="padding: 0.6rem 1.2rem;">Çıxış Et</button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Müştəri</th>
                            <th>Nömrə</th>
                            <th>Xidmət</th>
                            <th>Tarix</th>
                            <th style="text-align: right;">Əməliyyat</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTable">
                        <!-- Məlumatlar admin.js vasitəsilə buraya yüklənəcək -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDK-lar və Skriptlər -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
